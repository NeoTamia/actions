name: Template Sync Tests

on:
  push:
    branches:
      - main
    paths:
      - "template-sync/**"
      - ".github/workflows/template-sync.yml"
      - ".github/workflows/template-sync-test.yml"
  pull_request:
    paths:
      - "template-sync/**"
      - ".github/workflows/template-sync.yml"
      - ".github/workflows/template-sync-test.yml"
  workflow_dispatch:

jobs:
  test:
    name: Node tests
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Run template-sync tests
        run: node --test template-sync/*.test.mjs
