name: Template Sync

on:
  workflow_call:
    inputs:
      dry_run:
        description: "Apply changes in the runner workspace without opening a PR"
        required: false
        type: boolean
        default: false
      draft_pr:
        description: "Open the sync PR as a draft"
        required: false
        type: boolean
        default: false
      runs-on:
        description: "Optional label for the runner to run on"
        required: false
        type: string
        default: "['ubuntu-latest']"

jobs:
  sync:
    name: Pull parent template
    runs-on: ${{ fromJSON(inputs.runs-on) }}
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Resolve PR base branch
        id: base
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh api "repos/${{ github.repository }}/branches/dev" >/dev/null 2>&1; then
            echo "branch=dev" >> "$GITHUB_OUTPUT"
          else
            echo "branch=${{ github.event.repository.default_branch }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout this repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ steps.base.outputs.branch }}
          fetch-depth: 0

      - name: Checkout sync engine
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          path: .neotamia-actions
          sparse-checkout: template-sync
          persist-credentials: false

      - name: Apply parent template
        id: apply
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          node .neotamia-actions/template-sync/sync.mjs \
            --dest . \
            --dest-repo "${{ github.repository }}" \
            ${{ inputs.dry_run && '--dry-run' || '' }}
          rm -rf .neotamia-actions

      - name: Ensure template-sync label
        if: ${{ steps.apply.outputs.changed == 'true' && !inputs.dry_run }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh label create template-sync \
            --description "Automated updates from the parent template" \
            --color 0E8A16 \
            --force

      - name: Open pull request
        if: ${{ steps.apply.outputs.changed == 'true' && !inputs.dry_run }}
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8.1.1
        with:
          token: ${{ github.token }}
          branch: chore/template-sync
          base: ${{ steps.base.outputs.branch }}
          commit-message: ${{ steps.apply.outputs.title }}
          title: ${{ steps.apply.outputs.title }}
          body: ${{ steps.apply.outputs.body }}
          labels: template-sync
          draft: ${{ inputs.draft_pr || steps.apply.outputs.draft == 'true' }}
          signoff: false
          delete-branch: false
